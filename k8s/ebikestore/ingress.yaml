apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: ebikestore
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ebikestore.ruzzgd.dev
      secretName: ebikestore-tls
  rules:
    - host: ebikestore.ruzzgd.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: ebikestore
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/proxy-body-size: "6m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api-ebikestore.ruzzgd.dev
      secretName: ebikestore-api-tls
  rules:
    - host: api-ebikestore.ruzzgd.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
