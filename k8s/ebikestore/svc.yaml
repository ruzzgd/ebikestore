apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ebikestore
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ebikestore
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
