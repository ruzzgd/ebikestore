apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ebikestore
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ebikestore
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: ebikestore
spec:
  type: ExternalName
  externalName: minio.global.svc.cluster.local
  ports:
    - name: http
      port: 9000
      targetPort: 9000

