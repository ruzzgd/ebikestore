apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ebikestore
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: ebikestore
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ebikestore
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ebikestore
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
