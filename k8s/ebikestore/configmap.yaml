apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: ebikestore
data:
  NODE_ENV: "staging"
  SEED_TEST_DATA: "true"
  STARTUP_RETRY_ATTEMPTS: "10"
  STARTUP_RETRY_DELAY_SECONDS: "5"
  PORT: "5000"
  MYSQL_HOST: "mysql.global.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "ebikestore_db"
  MYSQL_USER: "ebikestore_user"
  JWT_EXPIRE: "24h"
  AUTH_COOKIE_DOMAIN: ".fideloebike.store"
  AUTH_COOKIE_SECURE: "true"
  CORS_ORIGIN: "https://fideloebike.store,https://www.fideloebike.store"
  FRONTEND_URL: "https://fideloebike.store"
  API_PUBLIC_URL: "https://api.fideloebike.store"
  MINIO_ENDPOINT: "minio.global.svc.cluster.local"
  MINIO_PORT: "9000"
  MINIO_PUBLIC_URL: "https://cdn.fideloebike.store"
  MINIO_BUCKET: "ebikestore-products"
  MINIO_USE_SSL: "false"
  BREVO_FROM_EMAIL: "noreply@fideloebike.store"
  BREVO_FROM_NAME: "Fidelo E-Bike Store"
  ADMIN_NAME: "System Administrator"
  ADMIN_EMAIL: "admin@gmail.com"

