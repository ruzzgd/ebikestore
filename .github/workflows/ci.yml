name: Build and Push Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./ebikestorefrontend
          file: ./ebikestorefrontend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            VITE_API_BASE_URL=https://api.fideloebike.store/api/v1
            VITE_INACTIVITY_TIMEOUT_MINUTES=30

          tags: |
            ghcr.io/${{ github.repository_owner }}/ebikestore/frontend:latest
            ghcr.io/${{ github.repository_owner }}/ebikestore/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete older frontend versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ebikestore/frontend
          package-type: container
          min-versions-to-keep: 3
          token: ${{ secrets.GITHUB_TOKEN }}

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ebikestorebackend
          file: ./ebikestorebackend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/ebikestore/backend:latest
            ghcr.io/${{ github.repository_owner }}/ebikestore/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete older backend versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ebikestore/backend
          package-type: container
          min-versions-to-keep: 3
          token: ${{ secrets.GITHUB_TOKEN }}

  trigger-deploy:
    name: Deploy to k3s
    needs:
      - build-frontend
      - build-backend
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
